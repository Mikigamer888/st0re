<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miki Store | Redirecting...</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 20px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #00ff00;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 { color: #00ff00; margin-bottom: 10px; }
        p { color: #aaaaaa; margin-bottom: 20px; }
        .footer { font-size: 0.8em; color: #555; margin-top: 20px; }
        a { color: #00ff00; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Miki Store</h1>
        <p>Redirecting to the actual server, because i can :P</p>
        <div class="loader" id="loader"></div>
        <p id="status">Fetching the URL...</p>
        <div class="footer">
            Waithing for too long? <a id="manualLink" href="#">Click here</a>
        </div>
    </div>

    <script>
        const configUrl = "https://raw.githubusercontent.com/Mikigamer888/st0re/refs/heads/main/new-catalog-url.txt";
        const statusElement = document.getElementById('status');
        const manualLink = document.getElementById('manualLink');

        async function performRedirect() {
            try {
                // Fetch the URL from the raw GitHub text file
                const response = await fetch(configUrl);
                if (!response.ok) throw new Error('Failed to fetch URL');
                
                const targetUrl = (await response.text()).trim();
                
                if (targetUrl.startsWith('http')) {
                    statusElement.innerText = "URL Found! Launching...";
                    manualLink.href = targetUrl;
                    
                    // Small delay to let the user see the "Legend" status
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 1500);
                } else {
                    statusElement.innerText = "Error: Invalid URL format in config.";
                    statusElement.style.color = "#ff4444";
                }
            } catch (error) {
                console.error(error);
                statusElement.innerText = "Could not connect.";
                statusElement.style.color = "#ff4444";
            }
        }

        // Start the process
        performRedirect();
    </script>
</body>
</html>
